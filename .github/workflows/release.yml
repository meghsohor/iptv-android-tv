name: Release APK

# Fires whenever commits land on main (this is what "merge a PR into main" looks like
# to Actions — there's no separate "PR merged" event, a merge is just a push to main).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0"

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease

      - name: Sign release APK
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          # The action's own default (29.0.3) isn't reliably present on the runner image;
          # pin to the version we explicitly install above instead.
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          files: ${{ steps.sign.outputs.signedReleaseFile }}
